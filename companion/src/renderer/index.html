<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'"
    />
    <title>Priinteve Time Tracker</title>
    <link rel="stylesheet" href="app.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <nav class="tabs" role="tablist">
        <button id="tab-timer" class="tab" role="tab" type="button" aria-selected="true">Timer</button>
        <button id="tab-today" class="tab" role="tab" type="button" aria-selected="false">Today</button>
      </nav>
      <span id="sync" class="sync" data-state="pending" title="">Connecting…</span>
      <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">⚙</button>
    </header>

    <section id="banner" class="banner" hidden aria-live="assertive"></section>

    <section id="update" class="update" hidden>
      <p id="update-text"></p>
      <div id="update-bar" class="bar" hidden><div id="update-fill" class="bar-fill"></div></div>
      <div id="update-actions" class="row-actions">
        <button id="btn-install" class="btn primary small" type="button">Install now</button>
        <button id="btn-later" class="btn small" type="button">Later</button>
      </div>
    </section>

    <main id="panel-timer" class="panel" role="tabpanel">
      <section class="clock-card" id="clock-card" data-status="IDLE">
        <p id="clock-status" class="clock-status">Not tracking</p>
        <p id="clock" class="clock" aria-live="off">00:00:00</p>
        <p id="clock-project" class="clock-project">Pick a project and task below to start.</p>
        <p id="clock-task" class="clock-task"></p>
        <p id="clock-meta" class="clock-meta"></p>
        <div class="clock-actions">
          <button id="btn-pause" class="btn" type="button" hidden>Pause</button>
          <button id="btn-resume" class="btn primary" type="button" hidden>Resume</button>
          <button id="btn-stop" class="btn danger" type="button" hidden>Stop</button>
        </div>
        <p id="action-note" class="note" hidden></p>
      </section>

      <section class="start-card">
        <h2 id="start-heading">Start a timer</h2>
        <label class="field">
          <span>Project</span>
          <select id="pick-project"></select>
        </label>
        <label class="field">
          <span>Task</span>
          <select id="pick-task"></select>
        </label>
        <label class="field" id="new-task-field" hidden>
          <span>New task title</span>
          <input id="new-task" type="text" maxlength="200" placeholder="What are you working on?" />
        </label>
        <div id="switch-confirm" class="confirm" hidden>
          <p>Stop the current timer and start this task?</p>
          <div class="row-actions">
            <button id="btn-switch-yes" class="btn primary small" type="button">Stop &amp; start</button>
            <button id="btn-switch-no" class="btn small" type="button">Cancel</button>
          </div>
        </div>
        <button id="btn-start" class="btn primary wide" type="button">Start timer</button>
        <p id="start-empty" class="hint" hidden>No projects are available to you yet. Ask an admin to assign you to one.</p>
      </section>

      <section id="notices" class="notices" hidden></section>

      <footer class="links">
        <button class="link" type="button" data-page="timesheet">Time history &amp; reports</button>
        <button class="link" type="button" data-page="tasks">All tasks</button>
      </footer>
    </main>

    <main id="panel-today" class="panel" role="tabpanel" hidden>
      <header class="today-head">
        <div>
          <h1 id="greeting">Today</h1>
          <p id="summary" class="hint">Loading your briefing…</p>
          <p id="offline" class="note warn" hidden></p>
        </div>
        <button id="btn-refresh" class="icon-btn" type="button" title="Refresh" aria-label="Refresh">⟳</button>
      </header>
      <div id="sections" class="sections"></div>
      <footer class="links">
        <button id="btn-stop-today" class="link" type="button" hidden>No more check-ins today</button>
      </footer>
    </main>
  </body>
</html>
